<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<script type="text/babel" src="transaction_4.jsx"></script>
<script type="text/babel" src="transaction_5.jsx"></script>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#38B2AC"
}/*EDITMODE-END*/;

function applyTweaks(tweaks) {
  // Recolor teal tokens based on primary color input
  const base = tweaks.primaryColor || '#38B2AC';
  // Create a scale by tinting/shading
  const hexToRgb = h => {
    const n = parseInt(h.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const rgbToHex = ([r,g,b]) => '#' + [r,g,b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2,'0')).join('');
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const [r,g,b] = hexToRgb(base);
  window.MINT.primary400 = base;
  window.MINT.primary500 = rgbToHex(mix([r,g,b],[0,0,0],0.15));
  window.MINT.primary600 = rgbToHex(mix([r,g,b],[0,0,0],0.3));
  window.MINT.primary300 = rgbToHex(mix([r,g,b],[255,255,255],0.25));
  window.MINT.primary200 = rgbToHex(mix([r,g,b],[255,255,255],0.55));
  window.MINT.primary100 = rgbToHex(mix([r,g,b],[255,255,255],0.75));
  window.MINT.gradStart = rgbToHex(mix([r,g,b],[255,255,255],0.88));
  window.MINT.gradEnd = rgbToHex(mix([r,g,b],[255,255,255],0.9));
}

function TweakPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, zIndex: 1000,
      width: 280, background: '#fff', borderRadius: 14,
      boxShadow: '0 10px 40px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.1)',
      padding: '14px 16px',
      fontFamily: '-apple-system, system-ui, sans-serif',
    }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: '#333', marginBottom: 10 }}>Tweaks</div>
      <label style={{ display: 'block', fontSize: 11, color: '#666', marginBottom: 4 }}>Primary color</label>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <input
          type="color"
          value={tweaks.primaryColor}
          onChange={e => setTweaks({ ...tweaks, primaryColor: e.target.value })}
          style={{ width: 40, height: 30, border: 'none', cursor: 'pointer', background: 'transparent' }}
        />
        <div style={{ fontSize: 12, fontFamily: 'monospace', color: '#333' }}>{tweaks.primaryColor}</div>
      </div>
      <div style={{ marginTop: 10, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
        {['#38B2AC','#319795','#14B8A6','#0D9488','#6366F1','#EC4899','#F59E0B','#10B981'].map(c => (
          <div key={c} onClick={() => setTweaks({ ...tweaks, primaryColor: c })}
            style={{
              width: 24, height: 24, borderRadius: 12, background: c, cursor: 'pointer',
              border: tweaks.primaryColor === c ? '2px solid #000' : '2px solid rgba(0,0,0,0.1)',
            }} />
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAKS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);
  const [version, setVersion] = React.useState(0);

  // Apply tweaks whenever they change
  React.useEffect(() => {
    applyTweaks(tweaks);
    setVersion(v => v + 1);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  // Edit-mode wiring
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  return (
    <>
      <DesignCanvas key={version}>
        <DCSection
          title="Mint Money — UI Recreation"
          subtitle="Pixel-faithful recreation of the current app, built from real theme tokens in the repo. Each artboard is a 390×844 iPhone 16 Pro viewport."
        >
          <DCArtboard label="01 · Home (top)" width={390} height={844}>
            <HomeScreen />
          </DCArtboard>
          <DCArtboard label="02 · Home (scrolled)" width={390} height={844}>
            <HomeScrolledScreen />
          </DCArtboard>
          <DCArtboard label="03 · Finance · กระเป๋า" width={390} height={844}>
            <FinanceScreen />
          </DCArtboard>
          <DCArtboard label="04 · Transaction · มีนาคม" width={390} height={844}>
            <TransactionScreen />
          </DCArtboard>
          <DCArtboard label="05 · Report · สรุป + Pie" width={390} height={844}>
            <ReportScreen />
          </DCArtboard>
          <DCArtboard label="06 · Report · Charts" width={390} height={844}>
            <ReportChartsScreen />
          </DCArtboard>
        </DCSection>

        <DCSection
          title="v2 — After UX Review"
          subtitle="P0: ลดสีแดง · Reorg Home (wallets/budget อยู่บน) · Rename nav (Home/Wallets/Activity/Insights/More) · P1: ปี พ.ศ. เต็ม · Currency flags · Custom SVG icons · Elevation hierarchy · ไม่มี DEBUG ribbon"
        >
          <DCArtboard label="01 · Home v2" width={390} height={844}>
            <HomeV2 />
          </DCArtboard>
          <DCArtboard label="02 · Wallets v2" width={390} height={844}>
            <WalletsV2 />
          </DCArtboard>
          <DCArtboard label="03 · Activity v2" width={390} height={844}>
            <ActivityV2 />
          </DCArtboard>
          <DCArtboard label="04 · Insights v2" width={390} height={844}>
            <InsightsV2 />
          </DCArtboard>
        </DCSection>

        <DCSection
          title="v3 — Home Redesign (AI-first + Action-first)"
          subtitle="ตามโครงสร้างเดิม: Quick Add ล่าง (กดง่าย) · AI Chat entry ชัด · AI Insight 2×2 grid สีเหลือง มี CTA ทุกอัน · Net Worth ย่อเป็น 1 บรรทัด · เพิ่ม streak counter + upcoming alert"
        >
          <DCArtboard label="Home v3 · AI-first" width={390} height={844}>
            <HomeV3 />
          </DCArtboard>
          <DCArtboard label="AI Chat · สอบถาม AI" width={390} height={844}>
            <AIChatScreen />
          </DCArtboard>
        </DCSection>

        <DCSection
          title="Add Transaction Bottom Sheet"
          subtitle="Smart Bottom Sheet theme แบบ Variation C · ครบทุก transaction type 8 หน้าจอ"
        >
<DCArtboard label="01′ · รายจ่าย (improved)" width={390} height={844}>
            <AddTxnE_Expense />
          </DCArtboard>
          <DCArtboard label="02 · รายรับ" width={390} height={844}>
            <AddTxnD_Income />
          </DCArtboard>
          <DCArtboard label="03 · บัตรเครดิต · จ่ายบัตร" width={390} height={844}>
            <AddTxnD_CreditPay />
          </DCArtboard>
          <DCArtboard label="04 · บัตรเครดิต · รับ Cashback" width={390} height={844}>
            <AddTxnD_CreditCashback />
          </DCArtboard>
          <DCArtboard label="05 · บัตรเครดิต · กดเงินสด" width={390} height={844}>
            <AddTxnD_CreditWithdraw />
          </DCArtboard>
          <DCArtboard label="06 · โอนเงิน" width={390} height={844}>
            <AddTxnD_Transfer />
          </DCArtboard>
          <DCArtboard label="07 · ออมเงิน · ออม" width={390} height={844}>
            <AddTxnD_SavingDeposit />
          </DCArtboard>
          <DCArtboard label="08 · ออมเงิน · ถอน" width={390} height={844}>
            <AddTxnD_SavingWithdraw />
          </DCArtboard>
        </DCSection>

        <DCSection
          title="v3 — Wallets Redesign (4 types)"
          subtitle="เรียบง่ายแบบ v2 + improvements รอบ 2 · กระเป๋า: sign logic + chevron + currency hint · บัตรเครดิต: status pill เปลี่ยนสีตาม utilization + countdown ตัดรอบ + ขั้นต่ำต้องจ่าย · เป้าหมาย: ออมเดือนละ X ฿ + on-track badge (เร็ว/ตามแผน/ช้า) · งบประมาณ: เหลือใช้วันละ X + sub-category mini bars + Today marker"
        >
          <DCArtboard label="01 · Wallets v3 · กระเป๋า" width={390} height={844}>
            <WalletsV3_Accounts />
          </DCArtboard>
          <DCArtboard label="02 · Wallets v3 · บัญชี list" width={390} height={844}>
            <WalletsV3_AccountsList />
          </DCArtboard>
          <DCArtboard label="03 · Wallets v3 · บัตรเครดิต" width={390} height={844}>
            <WalletsV3_Credit />
          </DCArtboard>
          <DCArtboard label="04 · Wallets v3 · เป้าหมาย" width={390} height={844}>
            <WalletsV3_Goals />
          </DCArtboard>
          <DCArtboard label="05 · Wallets v3 · งบประมาณ" width={390} height={844}>
            <WalletsV3_Budget />
          </DCArtboard>
        </DCSection>

        <DCSection
          title="v4 — Wallet Detail (bottom sheet)"
          subtitle="หน้ารายละเอียดของกระเป๋าเดียว · เปิดเป็น bottom sheet จากแถวบัญชีในหน้า Wallets · Hero snapshot → Quick Actions → เดือนนี้ (เข้า/ออก) → top categories → ผูกกับเป้าหมาย/งบ → transactions 20 รายการ (group by date)"
        >
          <DCArtboard label="01 · Wallet Detail · kbank" width={390} height={844}>
            <WalletDetailV4 />
          </DCArtboard>
          <DCArtboard label="02 · Credit Card Detail · KBank" width={390} height={844}>
            <CreditCardDetailV4 />
          </DCArtboard>
          <DCArtboard label="03 · Goal Detail · เที่ยวญี่ปุ่น" width={390} height={844}>
            <GoalDetailV4 />
          </DCArtboard>
          <DCArtboard label="04 · Budget Detail · งบใช้จ่ายรายเดือน" width={390} height={844}>
            <BudgetDetailV4 />
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <App.TweakPanel {...{ tweaks, setTweaks, visible: tweaksVisible }} />≠
    </>
  );
}
App.TweakPanel = TweakPanel;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
