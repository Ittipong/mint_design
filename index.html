// ─── Essentials — the only thing shown up front: type · name · icon&color · amount ───
function Essentials({ state, set }) {
  const { type, name, color, icon, amount } = state;
  const t = typeOf(type);
  const tcol = colorOf(t.color);
  return (
    <div style={{
      margin: '0 16px 12px', background: '#fff', borderRadius: 16,

      {/* TYPE — dropdown-style row → opens type menu */}
      <Row onClick={() => {}}>

        <div style={{ flex: 1, minWidth: 0 }}>

        <div style={{ flex: 1, minWidth: 0 }}>
          <Eyebrow>ชื่อกระเป๋า</Eyebrow>

      </Row>

      {/* ICON & COLOR — tappable → picker sheet */}
      <Row divider onClick={() => {}}>
        <div style={{
          width: 36, height: 36, borderRadius: 10, background: color.bg,
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}>
          <WIcon kind={icon} size={20} color={color.c} />
        </div>
        <div style={{ flex: 1, fontSize: 14, fontWeight: 600, color: W.n900 }}>ไอคอน & สี</div>
        <div style={{ width: 16, height: 16, borderRadius: 8, background: color.c }} />
        <WIcon kind="chev" size={16} color={INK.faint} />

            <div style={{ fontSize: 14, fontWeight: 700, color: W.n900, letterSpacing: -0.1 }}>ตั้งค่าเพิ่มเติม</div>
            <div style={{
              padding: '2px 6px', borderRadius: 6, background: INK.surface,
              color: INK.muted, fontSize: 9, fontWeight: 800, letterSpacing: 0.5,

          </div>
          <div style={{ fontSize: 11, fontWeight: 500, color: INK.muted, marginTop: 2 }}>

      {open && (

function DeleteRow() {

      margin: '4px 16px 0', padding: '14px',

      cursor: 'pointer',

// ─── Sticky bottom CTA ───
function StickyCta({ label, disabled }) {
  return (
    <div style={{
      position: 'absolute', left: 0, right: 0, bottom: 34, padding: '12px 16px 0',
      background: 'linear-gradient(to top, #fff 70%, rgba(255,255,255,0))',
    }}>
      <button disabled={disabled} style={{
        width: '100%', height: 50, borderRadius: 14, border: 'none',
        background: disabled ? W.n300 : W.primary400,
        color: disabled ? INK.faint : '#fff',
        fontSize: 16, fontWeight: 700, fontFamily: 'inherit',
        cursor: disabled ? 'not-allowed' : 'pointer',
        boxShadow: disabled ? 'none' : '0 4px 14px rgba(56,178,172,0.32)',
        transition: 'all 0.15s',
      }}>{label}</button>
    </div>
  );
}

// ─── Page — one component, two modes ───
function CreateWalletC1({ mode = 'create' }) {
  const isEdit = mode === 'edit';
  const seed = isEdit
    ? { name: 'KBank ออมทรัพย์', type: 'savings', colorKey: 'green', icon: 'piggy', amount: '15,000', goal: 'เก็บฉุกเฉิน 6 เดือน' }
    : { name: '', type: 'savings', colorKey: 'green', icon: 'piggy', amount: '', goal: '' };

  const [state, setState] = React.useState(seed);
  // advanced starts expanded only when editing (data already exists there)
  const [openAdvanced, setOpenAdvanced] = React.useState(isEdit);
  const set = (patch) => setState(s => ({ ...s, ...patch }));
  const color = colorOf(state.colorKey);

  const canSave = state.name.trim().length > 0;

  return (
    <div style={{ background: INK.surface, height: '100%', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <MintStatusBar time="12:03" />
      <Header title={isEdit ? 'แก้ไขกระเป๋า' : 'สร้างกระเป๋าใหม่'} saveEnabled={canSave} />
      <div style={{ flex: 1, overflow: 'auto', paddingBottom: 100 }}>
        <PreviewBar name={state.name} type={state.type} color={color} icon={state.icon} amount={state.amount} />
        <Essentials state={{ ...state, color }} set={set} />
        <Advanced open={openAdvanced} onToggle={() => setOpenAdvanced(o => !o)} goal={state.goal} set={set} />
        {isEdit && <DeleteRow />}
      </div>
      <StickyCta label={isEdit ? 'บันทึกการแก้ไข' : 'สร้างกระเป๋า'} disabled={!canSave} />
    </div>
  );
}

window.CreateWalletC1_Create = () => <CreateWalletC1 mode="create" />;
window.CreateWalletC1_Edit   = () => <CreateWalletC1 mode="edit" />;
})();
</script>

<script type="text/babel">
// Create Credit Card — 4-step Wizard
//   Step 1: เลือกธนาคารผู้ออกบัตร  (issuer tiles, 2-col grid — gives smart color defaults)
//   Step 2: ตั้งชื่อและหน้าตา      (name + last-4 digits + icon/color, with live preview)
//   Step 3: วงเงินและรอบบิล        (limit + outstanding + statement/due date + alert + currency)
//   Step 4: เป้าหมาย AI            (required goal with CC-specific examples)
//
// Why 4 steps (not the old single-page form):
//   - Old form crams 10+ fields on one screen — first-time user feels overwhelmed.
//   - Wizard splits by user mental task: identify card → personalize → billing → goal.
//   - Each step <30s to complete; total flow ~2 min, the same as old form but with
//     less cognitive load per screen.
//
// Visual language mirrors v4-create-wallet-a-wizard.jsx + v4-icon-color-picker.jsx
// (INK palette, eyebrow caps, SectionCard chrome, gradient-wash preview).
(function () {
const W = window.MINT;

// INK palette — mirrors the wallet wizard so both flows feel like one family.
const INK = {
  surface: '#F4F5F8',
  muted:   '#6B6B78',
  faint:   '#9A99A6',
  divider: '#ECECF1',

// Eyebrow caps — 10/600 INK.faint, letter-spacing 0.6, uppercase
function Eyebrow({ children }) {

// ─── Header (close/back + title + progress) ───
function Header({ step, total = 4, title, onBack }) {
  return (
    <div style={{ background: '#fff', paddingBottom: 12 }}>
      <div style={{ padding: '6px 16px 8px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          {onBack ? (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M15 6l-6 6 6 6" stroke={W.n800} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          ) : (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M6 6l12 12M18 6L6 18" stroke={W.n800} strokeWidth="2.2" strokeLinecap="round" />
            </svg>
          )}
        </div>

// ─── Step intro — large question + supporting line ───
function StepIntro({ title, sub }) {

// ─── Sticky CTA ───
function StickyCta({ label, disabled }) {

    <div style={{
      position: 'absolute', left: 0, right: 0, bottom: 34, padding: '12px 16px 0',

const cardShadow = '0 1px 2px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.03)';

const card = {

function Eyebrow({ children }) {
  return (
    <div style={{
      fontSize: 10, color: INK.faint, fontWeight: 600,

function Header({ step, total = 4, title, onBack }) {
  return (
    <div style={{ background: '#fff', paddingBottom: 12 }}>
      <div style={{ padding: '6px 16px 8px', display: 'flex', alignItems: 'center', gap: 8 }}>

          {onBack ? (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">

        <div style={{ width: 32, fontSize: 12, color: W.n400, textAlign: 'right' }}>{step}/{total}</div>
      </div>
      {/* progress segments — N bars separated by white gaps so user can count steps */}
      <div style={{ display: 'flex', gap: 4, margin: '4px 16px 0' }}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{
            flex: 1, height: 3, borderRadius: 2,

function StepIntro({ title, sub }) {

function StickyCta({ label, disabled }) {
  return (
    <div style={{
      position: 'absolute', left: 0, right: 0, bottom: 34, padding: '12px 16px 0',

        width: '100%', height: 50, borderRadius: 14, border: 'none',
        background: disabled ? W.n300 : W.primary400,
        color: disabled ? INK.faint : '#fff',

    case 'home': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9z" fill={color}/></svg>;
    case 'car': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M4 13l1.5-5h13L20 13v5h-2v-2H6v2H4v-5z" fill={color}/><circle cx="7.5" cy="15.5" r="1.5" fill={W.n800}/><circle cx="16.5" cy="15.5" r="1.5" fill={W.n800}/></svg>;
    case 'calc': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" fill={color}/><rect x="7" y="5" width="10" height="4" rx="1" fill={W.n800} opacity="0.3"/><circle cx="9" cy="13" r="1" fill={W.n800}/><circle cx="12" cy="13" r="1" fill={W.n800}/><circle cx="15" cy="13" r="1" fill={W.n800}/><circle cx="9" cy="17" r="1" fill={W.n800}/><circle cx="12" cy="17" r="1" fill={W.n800}/><circle cx="15" cy="17" r="1" fill={W.n800}/></svg>;
    case 'piggy': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 12c0-3 3-5 7-5s7 2 7 5c0 1-.4 2-1 2.8L18 17h-2l-.5-1.5c-.8.3-1.6.5-2.5.5h-2l-.5 1.5H8.5L7 14c-.5-.4-.8-.7-1.2-1L4 13v-2l1.4.2C5.1 11 5 11.4 5 12z" fill={color}/><circle cx="14" cy="11" r="0.8" fill={W.n800}/></svg>;

    case 'shopping': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 7h14l-1 13H6L5 7z" fill={color}/><path d="M9 7V5a3 3 0 016 0v2" stroke={W.n800} strokeWidth="1.4" fill="none"/></svg>;
    case 'envelope': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" fill={color}/><path d="M3 7l9 7 9-7" stroke={W.n800} strokeWidth="1.4" fill="none" opacity="0.5"/></svg>;
    case 'savings': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 11c0-2.8 2.7-5 6-5 1.4 0 2.6.4 3.6 1.1L17 6l-.5 2.6c.9.9 1.5 2.1 1.5 3.4 0 .9-.3 1.7-.7 2.5l.7 1.5h-2.5l-.6-.6c-.7.4-1.5.6-2.4.6h-1l-1 2h-2v-2H7c-1.1 0-2-.9-2-2v-2.5L3 12l1-2 1 1z" fill={color}/></svg>;

}

<script type="text/babel">
// Create Budget — 5-step Wizard
//   Step 1: เลือกประเภทงบ          (preset tiles — gives smart defaults for color+icon)
//   Step 2: ตั้งชื่อและหน้าตา       (name + icon/color, with live preview)
//   Step 3: ยอดงบ + ช่วงเวลา       (amount hero + currency + period chips + repeat toggle)
//   Step 4: กระเป๋าและหมวดหมู่      (multi-wallet selection with nested category chips)
//   Step 5: เป้าหมาย AI            (required — budget-specific motivations)
//
// Why 5 steps (not 4 like the others):
//   - Old form crams 6+ sections (basic info, wallets, categories, period, repeat, goal).
//   - Wallet+category selection is genuinely complex — multi-select with nested chips
//     per wallet — and earns its own step.
//   - Splitting period/wallet from each other keeps each step focused (<30s).
//
// Visual language mirrors the other wizards (INK + eyebrow + SectionCard + gradient wash).
(function () {
const W = window.MINT;

const INK = {
  surface: '#F4F5F8',
  muted:   '#6B6B78',
  faint:   '#9A99A6',
  divider: '#ECECF1',
  hairline:'#F0F0F4',
};

const cardShadow = '0 1px 2px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.03)';
const card = { background: '#fff', borderRadius: 16, boxShadow: cardShadow };

function Eyebrow({ children }) {
  return (
    <div style={{
      fontSize: 10, color: INK.faint, fontWeight: 600,
      letterSpacing: 0.6, textTransform: 'uppercase',
    }}>{children}</div>
  );
}

function Header({ step, total = 5, title, onBack }) {
  return (
    <div style={{ background: '#fff', paddingBottom: 12 }}>
      <div style={{ padding: '6px 16px 8px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          {onBack ? (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M15 6l-6 6 6 6" stroke={W.n800} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          ) : (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M6 6l12 12M18 6L6 18" stroke={W.n800} strokeWidth="2.2" strokeLinecap="round" />
            </svg>
          )}
        </div>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 17, fontWeight: 700, color: W.n900 }}>{title}</div>
        <div style={{ width: 32, fontSize: 12, color: W.n400, textAlign: 'right' }}>{step}/{total}</div>
      </div>
      {/* progress segments — N bars separated by white gaps so user can count steps */}
      <div style={{ display: 'flex', gap: 4, margin: '4px 16px 0' }}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{
            flex: 1, height: 3, borderRadius: 2,
            background: i < step ? W.primary400 : W.n300,
            transition: 'background 0.3s',
          }} />
        ))}
      </div>

}

function StepIntro({ title, sub }) {
  return (
    <div style={{ padding: '18px 20px 8px' }}>
      <div style={{ fontSize: 22, fontWeight: 700, color: W.n900, letterSpacing: -0.3, lineHeight: 1.3 }}>{title}</div>
      {sub && <div style={{ fontSize: 13, color: INK.muted, marginTop: 4, lineHeight: 1.4 }}>{sub}</div>}
    </div>
  );
}

function StickyCta({ label, disabled }) {
  return (
    <div style={{
      position: 'absolute', left: 0, right: 0, bottom: 34, padding: '12px 16px 0',
      background: 'linear-gradient(to top, #fff 70%, rgba(255,255,255,0))',
    }}>
      <button disabled={disabled} style={{
        width: '100%', height: 50, borderRadius: 14, border: 'none',
        background: disabled ? W.n300 : W.primary400,
        color: disabled ? INK.faint : '#fff',
        fontSize: 16, fontWeight: 700, fontFamily: 'inherit',
        cursor: disabled ? 'not-allowed' : 'pointer',
        boxShadow: disabled ? 'none' : '0 4px 14px rgba(56,178,172,0.32)',
        transition: 'all 0.15s',
      }}>{label}</button>
    </div>
  );
}

function WIcon({ kind, size = 24, color = '#fff' }) {
  const s = { width: size, height: size };

function SectionCard({ title, meta, leadingIcon, trailing, onToggle, collapsible, open = true, children }) {
  return (
    <div style={{
      margin: '0 16px 12px',
      background: '#fff', borderRadius: 16,
      boxShadow: cardShadow, overflow: 'hidden',
    }}>
      <div
        onClick={onToggle}
        style={{
          padding: '14px 16px 12px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          cursor: collapsible ? 'pointer' : 'default',
        }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
          {leadingIcon}
          <div style={{ fontSize: 14, fontWeight: 700, color: W.n900, letterSpacing: -0.1 }}>{title}</div>
          {meta && <div style={{ fontSize: 11, fontWeight: 500, color: INK.muted }}>· {meta}</div>}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {trailing}
          {collapsible && (
            <div style={{ transform: open ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s', display: 'flex' }}>
              <WIcon kind="chev" size={16} color={INK.faint} />
            </div>
          )}
        </div>
      </div>
      {open && children}
    </div>
  );
}

<script type="text/babel">
// Unified Icon + Color Picker — bottom sheet
//   เปิดจาก: tap icon/color slot ในหน้า Create Wallet (หรือ Edit Wallet)
//   เป้าหมาย: เลือก icon + สี + เห็น preview ในแผ่นเดียว — ไม่ต้องเปิด 2 sheets
//
// Visual rewrite (v2):
//   - Adopted INK palette (muted/faint/divider) from v4-wallet-detail for AA-grade
//     secondary text and a quieter divider tone (#ECECF1 vs harsher n300).
//   - Spacing scale locked to multiples of 4 (4/8/12/16/20/24). No more 10/14 outliers.
//   - Typography rhythm:
//       Section title : 14/700 n900
//       Section meta  : 11/500 INK.muted        (e.g. "10 ไอคอน")
//       Eyebrow caps  : 10/600 INK.faint LS=0.6 (e.g. "ตัวอย่าง", "เลือกสี")
//       Row label     : 13/600 n900
//       Body hint     : 12/500 INK.muted
//   - Cards-on-canvas: sheet body switches to neutral n200 so each section reads as a
//     calm card with one soft shadow and NO border. Borders + shadows together were
//     the #1 cause of "ตาลาย".
//   - Color row redesigned: trailing "ทั้งหมด" becomes a neutral ghost chip, divider
//     line removed (whitespace separates), check ring uses soft glow not double-shadow.
//   - Store pack rows: borders dropped in favor of a single thin divider; price pill
//     shrunk and tinted to its category so it stops shouting.
(function () {
const W = window.MINT;

// Eye-friendly overlay tokens — mirror v4-wallet-detail.jsx so the two screens feel
// like part of the same family. WCAG AA on white at body text sizes.
const INK = {
  surface: '#F4F5F8',   // sheet body — sits between cards so white pops
  muted:   '#6B6B78',   // secondary text (5.6:1 on white)
  faint:   '#9A99A6',   // tertiary text — 11px+ only
  divider: '#ECECF1',   // soft separator — replaces n300 for in-card dividers
  hairline:'#F0F0F4',   // even softer — for row separation inside cards
};

// 5-hue swatch row — full palette lives in Color Picker Sheet (artboard 03).
const PAIRS = [
  { k: 'mint',   ic: W.primary400,   bg: W.primary100 },
  { k: 'sky',    ic: W.info400,      bg: W.info200 },
  { k: 'violet', ic: W.walletViolet, bg: W.walletViolet100 },
  { k: 'coral',  ic: W.walletRed,    bg: W.walletRed100 },
  { k: 'amber',  ic: W.warning400,   bg: '#FCEFD9' },
];

// Single shadow recipe — used everywhere a card is needed. Borders are forbidden
// on any container that already carries this shadow.
const cardShadow = '0 1px 2px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.03)';

function WIcon({ kind, size = 22, color = '#fff' }) {
  const s = { width: size, height: size };
  switch (kind) {
    case 'piggy': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 12c0-3 3-5 7-5s7 2 7 5c0 1-.4 2-1 2.8L18 17h-2l-.5-1.5c-.8.3-1.6.5-2.5.5h-2l-.5 1.5H8.5L7 14c-.5-.4-.8-.7-1.2-1L4 13v-2l1.4.2C5.1 11 5 11.4 5 12z" fill={color}/><circle cx="14" cy="11" r="0.8" fill={W.n800}/></svg>;
    case 'wallet': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" fill={color}/><circle cx="17" cy="13" r="1.4" fill={W.n800}/></svg>;
    case 'salary': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 7h14v12a1 1 0 01-1 1H6a1 1 0 01-1-1V7z" fill={color}/><path d="M9 7V5a3 3 0 016 0v2" stroke={W.n800} strokeWidth="1.4" fill="none"/></svg>;
    case 'cash': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" fill={color}/><circle cx="12" cy="12" r="2.5" fill="none" stroke={W.n800} strokeWidth="1.4"/></svg>;
    case 'card': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="14" rx="2.5" fill={color}/><rect x="2" y="10" width="20" height="2.5" fill={W.n800} opacity="0.5"/></svg>;
    case 'savings': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 11c0-2.8 2.7-5 6-5 1.4 0 2.6.4 3.6 1.1L17 6l-.5 2.6c.9.9 1.5 2.1 1.5 3.4 0 .9-.3 1.7-.7 2.5l.7 1.5h-2.5l-.6-.6c-.7.4-1.5.6-2.4.6h-1l-1 2h-2v-2H7c-1.1 0-2-.9-2-2v-2.5L3 12l1-2 1 1z" fill={color}/></svg>;
    case 'ewallet': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="12" height="18" rx="2.5" fill={color}/><rect x="9" y="6" width="6" height="7" rx="1" fill={W.n800} opacity="0.2"/></svg>;
    case 'qr': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" fill={color}/><rect x="14" y="3" width="7" height="7" fill={color}/><rect x="3" y="14" width="7" height="7" fill={color}/><rect x="14" y="14" width="3" height="3" fill={color}/><rect x="18" y="18" width="3" height="3" fill={color}/></svg>;
    case 'shop': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M4 9l1.5-4h13L20 9v2a2 2 0 01-2 2H6a2 2 0 01-2-2V9z" fill={color}/><rect x="5" y="13" width="14" height="7" fill={color} opacity="0.7"/></svg>;
    case 'chart': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="4" y="14" width="3" height="6" rx="1" fill={color}/><rect x="10" y="10" width="3" height="10" rx="1" fill={color}/><rect x="16" y="6" width="3" height="14" rx="1" fill={color}/></svg>;
    case 'pie': return <svg style={s} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill={color}/><path d="M12 3v9l8 3a9 9 0 00-8-12z" fill={W.n800} opacity="0.35"/></svg>;
    case 'calc': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" fill={color}/><rect x="7" y="5" width="10" height="4" rx="1" fill={W.n800} opacity="0.3"/><circle cx="9" cy="13" r="1" fill={W.n800}/><circle cx="12" cy="13" r="1" fill={W.n800}/><circle cx="15" cy="13" r="1" fill={W.n800}/><circle cx="9" cy="17" r="1" fill={W.n800}/><circle cx="12" cy="17" r="1" fill={W.n800}/><circle cx="15" cy="17" r="1" fill={W.n800}/></svg>;
    case 'envelope': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" fill={color}/><path d="M3 7l9 7 9-7" stroke={W.n800} strokeWidth="1.4" fill="none" opacity="0.5"/></svg>;
    case 'home': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9z" fill={color}/></svg>;
    case 'car': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M4 13l1.5-5h13L20 13v5h-2v-2H6v2H4v-5z" fill={color}/><circle cx="7.5" cy="15.5" r="1.5" fill={W.n800}/><circle cx="16.5" cy="15.5" r="1.5" fill={W.n800}/></svg>;
    case 'food': return <svg style={s} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill={color}/><circle cx="12" cy="12" r="5" fill={W.n800} opacity="0.2"/></svg>;
    case 'coffee': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 7h12v8a4 4 0 01-4 4H9a4 4 0 01-4-4V7z" fill={color}/><path d="M17 9h2a2 2 0 010 4h-2" fill="none" stroke={color} strokeWidth="1.8"/></svg>;
    case 'gift': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="9" width="18" height="3" fill={color}/><rect x="5" y="12" width="14" height="9" fill={color} opacity="0.85"/><rect x="11" y="9" width="2" height="12" fill={W.n800} opacity="0.4"/></svg>;
    case 'gas': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 4h7v16H5z" fill={color}/><path d="M13 8h2l2 2v8a2 2 0 002 2" stroke={color} strokeWidth="1.6" fill="none"/></svg>;
    case 'shopping': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 7h14l-1 13H6L5 7z" fill={color}/><path d="M9 7V5a3 3 0 016 0v2" stroke={W.n800} strokeWidth="1.4" fill="none"/></svg>;
    case 'plane': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M21 11l-9 4-2 5-2-3-3-2 5-2 4-9 7 7z" fill={color}/></svg>;
    case 'chev': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    case 'check': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-10" stroke={color} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    case 'close': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke={color} strokeWidth="2.2" strokeLinecap="round"/></svg>;
    case 'star-line': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M12 3l2.5 6 6.5.5-5 4.5 1.5 6.5L12 17l-5.5 3.5L8 14 3 9.5 9.5 9 12 3z" fill="none" stroke={color} strokeWidth="1.6" strokeLinejoin="round"/></svg>;
    case 'library': return <svg style={s} viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.6" fill="none"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.6" fill="none"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.6" fill="none"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.6" fill="none"/></svg>;
    case 'crown': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M3 8l4 5 5-8 5 8 4-5v10H3V8z" fill={color}/></svg>;
    case 'arrow': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    case 'plus': return <svg style={s} viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke={color} strokeWidth="2.4" strokeLinecap="round"/></svg>;
    default: return null;
  }
}

// ────────────────────────────────────────────────
// Header — handle / close / title / library entry
// ────────────────────────────────────────────────
function PickerHeader({ title }) {
  return (
    <>
      <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 8, paddingBottom: 8 }}>
        <div style={{ width: 36, height: 4, borderRadius: 2, background: W.n300 }} />
      </div>
      <div style={{ padding: '4px 16px 12px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          <WIcon kind="close" size={20} color={W.n800} />
        </div>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 16, fontWeight: 700, color: W.n900, letterSpacing: -0.1 }}>{title}</div>
        {/* Library entry — ghost (no fill) so the close+title axis stays the visual primary */}
        <div style={{
          width: 32, height: 32, borderRadius: 10,
          display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
        }}>
          <WIcon kind="library" size={18} color={W.n700} />
        </div>
      </div>
    </>
  );
}

// ────────────────────────────────────────────────
// Section frame — uniform card chrome for every grid section.
// All four grid sections (ใช้บ่อย / ของฉัน / Basic / ขนส่ง) share this.
// Header layout: title (14/700) + meta (11/500) on left; optional trailing slot on right.
// ────────────────────────────────────────────────
function SectionCard({ title, meta, leadingIcon, trailing, onToggle, collapsible, open = true, children }) {
  return (
    <div style={{
      background: '#fff', borderRadius: 16, marginBottom: 12,
      boxShadow: cardShadow, overflow: 'hidden',
    }}>
      <div
        onClick={onToggle}
        style={{
          padding: '14px 16px 12px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          cursor: collapsible ? 'pointer' : 'default',
        }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
          {leadingIcon}
          <div style={{ fontSize: 14, fontWeight: 700, color: W.n900, letterSpacing: -0.1 }}>{title}</div>
          {meta && <div style={{ fontSize: 11, fontWeight: 500, color: INK.muted }}>· {meta}</div>}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {trailing}
          {collapsible && (
            <div style={{ transform: open ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s', display: 'flex' }}>
              <WIcon kind="chev" size={16} color={INK.faint} />
            </div>
          )}
        </div>
      </div>
      {open && children}
    </div>
  );
}

// ────────────────────────────────────────────────
// Main picker
// ────────────────────────────────────────────────
function IconColorPicker() {
  const [pair, setPair] = React.useState(PAIRS[2]); // violet default
  const [icon, setIcon] = React.useState('piggy');
  const [openPacks, setOpenPacks] = React.useState({ basic: true, standard: true });

  const togglePack = (k) => setOpenPacks(p => ({ ...p, [k]: !p[k] }));

  const FAVES = ['piggy', 'wallet', 'salary', 'cash', 'card'];
  const BASIC = ['savings', 'ewallet', 'qr', 'shop', 'chart', 'pie', 'calc', 'envelope', 'wallet', 'cash'];
  const STD   = ['home', 'car', 'food', 'coffee', 'gift', 'gas', 'shopping', 'plane'];

  // ── Icon cell ─────────────────────────────────
  // Active state: tinted bg + colored icon + small check badge.
  // Inactive: flat n200 tile, NO border (whitespace + grid gap define the shape).
  const IconCell = ({ k }) => {
    const active = icon === k;
    return (
      <div onClick={() => setIcon(k)} style={{
        aspectRatio: '1 / 1',
        background: active ? pair.bg : INK.surface,
        borderRadius: 14,
        boxShadow: active ? `inset 0 0 0 1.5px ${pair.ic}` : 'none',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer',
        position: 'relative',
        transition: 'background 0.15s, box-shadow 0.15s',
      }}>
        <WIcon kind={k} size={26} color={active ? pair.ic : W.n700} />
        {active && (
          <div style={{
            position: 'absolute', top: 4, right: 4,
            width: 16, height: 16, borderRadius: 8, background: pair.ic,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <WIcon kind="check" size={10} color="#fff" />
          </div>
        )}
      </div>
    );
  };

  const Grid = ({ kinds }) => (
    <div style={{ padding: '0 16px 16px', display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8 }}>
      {kinds.map(k => <IconCell key={k} k={k} />)}

  );

  return (
    <div style={{ background: W.n200, height: '100%', position: 'relative', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <MintStatusBar time="12:25" />

      {/* faded host screen */}
      <div style={{ flex: 1, padding: '12px 20px', opacity: 0.5 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
          <WIcon kind="close" size={18} color={W.n800} />
          <div style={{ flex: 1, textAlign: 'center', fontSize: 17, fontWeight: 700, color: W.n900 }}>สร้างกระเป๋าใหม่</div>
          <div style={{ width: 24 }}/>
        </div>
      </div>

      {/* dim backdrop */}
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.18)', pointerEvents: 'none' }} />

      {/* SHEET */}
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0, top: 90,
        background: '#fff',
        borderTopLeftRadius: 22, borderTopRightRadius: 22,
        boxShadow: '0 -12px 30px rgba(0,0,0,0.10)',
        display: 'flex', flexDirection: 'column', overflow: 'hidden',
      }}>
        <PickerHeader title="ไอคอน & สี" />

        {/* ── LIVE PREVIEW ───────────────────────────
            Floating card on a soft gradient wash. Card itself has no shadow — the
            tinted wash IS the elevation cue, which keeps the area calm. */}
        <div style={{
          padding: '4px 16px 20px',
          background: `linear-gradient(180deg, ${pair.bg} 0%, transparent 100%)`,
        }}>
          <div style={{
            background: '#fff', borderRadius: 16, padding: '14px 16px',
            display: 'flex', alignItems: 'center', gap: 14,
          }}>
            <div style={{
              width: 52, height: 52, borderRadius: 14, background: pair.bg,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            }}>
              <WIcon kind={icon} size={28} color={pair.ic} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 10, color: INK.faint, fontWeight: 600, letterSpacing: 0.6, textTransform: 'uppercase' }}>ตัวอย่าง</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: W.n900, marginTop: 2, letterSpacing: -0.1 }}>KBank ออมทรัพย์</div>

        {/* ── SCROLLABLE BODY ────────────────────────

            width: 56, height: 56, borderRadius: 16, margin: '0 auto 10px',

            สวัสดีครับ ผม Melon

          <div style={{ fontSize: 12.5, color: INK.muted, lineHeight: 1.5 }}>

// ────────────────────────────────────────────────────────────────────
// Design 2 — Active state: long AI response + quick replies (ตามรูป)
// ────────────────────────────────────────────────────────────────────
function MelonChatActive() {
  const quickReplies = [
    'เดือนนี้รายรับเท่าไหร่',

        display: 'flex', flexDirection: 'column',

          <div style={{ fontSize: 13.5, fontWeight: 700, color: INK.body, lineHeight: 1.45 }}>

          </div>
          <Bullets items={[
            'ได้ดอกเบี้ยต่ำกว่าบัตร (~12-15%)',
            'อยากจบเป็นก้อนเดียว ไม่ต้องทบทุกเดือน',
            'มีวินัยผ่อนตรงเวลา',

          <div style={{ fontSize: 13.5, fontWeight: 700, color: INK.body, lineHeight: 1.45, marginTop: 4 }}>
            จ่ายขั้นต่ำก็พอได้ถ้า:

          <Bullets items={[
            <>มีแผนจะปิดหมดภายใน <strong>2-3 เดือน</strong> (แล้วดอกเบี้ยจะน้อยมาก)</>,
            'หรือกำลังหาเงินก้อนมาโปะอยู่',

          {/* divider */}
          <div style={{ height: 1, background: INK.divider, margin: '10px 0 4px' }}/>

          {/* Recommendation */}
          <div style={{ fontSize: 13.5, color: INK.body, lineHeight: 1.55 }}>
            <strong>แต่ทางที่ดีที่สุดสำหรับคุณตอนนี้:</strong> ยอด CardX แค่ 28,000 เยน
            {' '}(~6,700 บาท) — ถ้าสามารถหาเงินก้อนมาจ่ายเต็มได้
            {' '}<strong>นี่คือทางที่ถูกสุด = ดอกเบี้ย 0%</strong> 🎯
          </div>

          {/* Follow-up question */}
          <div style={{ fontSize: 13.5, color: INK.body, lineHeight: 1.55, marginTop: 2 }}>
            มีเงินเก็บพอปิดล้มทั้งยอดได้ไหมครับ? หรืออยากให้ช่วยดูรายรับเดือนนี้ว่าพอจ่ายเต็มไหวไหม? 💪
          </div>

          {/* Quick reply chips — เรียงตั้ง 3 ใบ */}
          <div style={{
            display: 'flex', flexDirection: 'column', gap: 6,
            alignItems: 'flex-start', marginTop: 6,
          }}>
            {quickReplies.map((q, i) => (
              <div key={i} style={{
                padding: '7px 14px',
                borderRadius: 999,
                background: INK.chipBg,
                border: `1px solid ${INK.chipBorder}`,
                color: INK.chipText,
                fontSize: 12.5, fontWeight: 500,
                cursor: 'pointer',
              }}>{q}</div>
            ))}
          </div>

          {/* timestamp */}
          <div style={{
            fontSize: 11, color: '#B5B3C0', textAlign: 'right',
            padding: '6px 4px 0',

window.MelonChatInit = MelonChatInit;

<script type="text/babel">
// Root Pager — หน้า root ใหม่ของ app · pager 2 หน้า
//   Layout: status bar → compact segment (header) → content (swipeable)
//     - Page 1 "Chat":    MelonChatInit (embedded mode, ซ่อน "Melon Chat" header)
//     - Page 2 "Finance": HomeV3 (hideStatusBar=true, มี bottom tabbar ของตัวเอง)
//   Segment เป็นแบบ compact iOS-style (pill, centered, ~30px tall) ไม่มี title bar
//   เพื่อให้ได้พื้นที่ content เพิ่ม ~50px
//   Swipe ได้ทั้ง 2 ทิศ (gesture ของ PageView ในจริง — artboard เป็น static demo)
(function () {
const RP = window.MINT;

// ─── Bell icon — global header action (right side of segment row) ───
function HeaderBell() {
  return (
    <div style={{ position: 'relative', cursor: 'pointer' }}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 3a6 6 0 00-6 6v3l-2 3v1h16v-1l-2-3V9a6 6 0 00-6-6zM9 18a3 3 0 006 0"
              stroke={RP.n700} strokeWidth="1.8" strokeLinejoin="round"/>
      </svg>
      <div style={{
        position:'absolute', top:-1, right:-1, width:7, height:7, borderRadius:4,
        background: RP.error400, border:'1.5px solid #fff',
      }}/>
    </div>
  );
}

// ─── Compact segmented control (iOS-style) ───────────────────────────
// Acts as the screen's only header (no title bar). flex:1 wrappers on
// both sides keep the pill optically centered regardless of how many
// icons sit in rightSlot (1 bell ↔ 3 page actions).
function CompactSegment({ active, leftSlot, rightSlot }) {
  const items = [
    { key: 'chat',    label: 'Chat' },
    { key: 'finance', label: 'Finance' },
  ];
  const right = rightSlot !== undefined ? rightSlot : <HeaderBell />;
  return (
    <div style={{
      padding: '8px 16px 12px',
      display: 'flex', alignItems: 'center',
      background: 'transparent',
    }}>
      {/* Left slot — page-specific actions (e.g. Transaction's 🔍); mirror keeps pill centered */}
      <div style={{ flex: 1, display: 'flex', justifyContent: 'flex-start', alignItems: 'center', gap: 14 }}>
        {leftSlot}
      </div>

      <div style={{
        display: 'inline-flex',
        background: 'rgba(118,118,128,0.12)',
        padding: 3,
        borderRadius: 9,
        flexShrink: 0,
      }}>
        {items.map(it => {
          const isActive = it.key === active;
          return (
            <div key={it.key} style={{
              padding: '5px 26px',
              borderRadius: 7,
              background: isActive ? '#fff' : 'transparent',
              boxShadow: isActive
                ? '0 3px 8px rgba(0,0,0,0.12), 0 1px 1px rgba(0,0,0,0.04)'
                : 'none',
              fontSize: 13,
              fontWeight: isActive ? 600 : 500,
              color: isActive ? '#1A1A1A' : '#6B6B78',
              letterSpacing: -0.1,
              cursor: 'pointer',
              transition: 'background 0.2s',
            }}>{it.label}</div>
          );
        })}
      </div>

      {/* Right slot — bell by default, or page-specific actions (e.g. Transaction's 🔍 ⏱ ⋮) */}
      <div style={{ flex: 1, display: 'flex', justifyContent: 'flex-end', alignItems: 'center', gap: 14 }}>
        {right}
      </div>
    </div>
  );
}

// ─── Shell — status bar + segment + content ─────────────────────────
// headerBg = สีของ status bar + segment area (white = ให้ pill contrast ชัด)
// contentBg = สีของ content area (ตามแต่ละ tab — Chat=white, Finance=grey)
// 2 zones นี้ทำให้ segment อ่านเป็น "header" ไม่ใช่ floating control
function RootPagerShell({ active, headerBg = '#fff', contentBg = '#fff', leftSlot, rightSlot, children }) {
  return (
    <div style={{
      background: headerBg, height: '100%',
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
      fontFamily: 'Sarabun, -apple-system, system-ui, sans-serif',
    }}>
      <MintStatusBarV2 time="10:13" />
      <CompactSegment active={active} leftSlot={leftSlot} rightSlot={rightSlot} />
      <div style={{ flex: 1, overflow: 'hidden', position: 'relative', background: contentBg }}>
        {children}
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────
// Page 1 — Chat tab active
// ────────────────────────────────────────────────────────────────────
function RootPagerChat() {
  return (
    <RootPagerShell active="chat" headerBg="#fff" contentBg="#fff">
      {/* MelonChatInit ใน embedded mode: ไม่มี status bar / "Melon Chat" header */}
      <MelonChatInit embedded />
    </RootPagerShell>
  );
}

// ────────────────────────────────────────────────────────────────────
// Page 2 — Finance tab active (= Home v3 + tabbar)
// ────────────────────────────────────────────────────────────────────
function RootPagerFinance() {
  return (
    <RootPagerShell active="finance" headerBg="#fff" contentBg={RP.n200}>
      {/* HomeV3 ปิด status bar ของตัวเอง · bottom tabbar ของ HomeV3 ยังคงอยู่
          contentBg=grey จะถูก HomeV3 ทับด้วย bg ของตัวเองอยู่แล้ว — ใส่ไว้กัน flash */}
      <HomeV3 hideStatusBar />
    </RootPagerShell>
  );
}

// ────────────────────────────────────────────────────────────────────
// Page 2 (sub) — Finance · กระเป๋า (bottom-tab = Wallets)
//   User เปิด Finance segment แล้วกดที่ bottom tab "Wallets" → FinanceScreen
// ────────────────────────────────────────────────────────────────────
// Right-side action for Wallets page — plain "+" icon (matches TxRightActions style)
function WalletsRightActions() {
  return (
    <div style={{ cursor: 'pointer', display: 'flex' }}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke={RP.n700} strokeWidth="2.2" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

function RootPagerWallets() {
  return (
    <RootPagerShell active="finance" headerBg="#fff" contentBg={RP.n200}
      rightSlot={<WalletsRightActions />}>
      <FinanceScreen hideStatusBar />
    </RootPagerShell>
  );
}

// ────────────────────────────────────────────────────────────────────
// Page 2 (sub) — Finance · Transaction (bottom-tab = Activity)
//   User เปิด Finance segment แล้วกดที่ bottom tab "Activity" → TransactionScreen
//   Bell ของ default shell ถูกแทนด้วยปุ่มของหน้า Transaction:
//     left  → 🔍 search (primary discovery action)
//     right → ⏱ upcoming, ⋮ more
//   วาง search ฝั่งซ้ายช่วยให้นิ้วโป้งขวาเข้าถึง ⋮ ได้ง่ายขึ้น และ
//   ให้ search ไม่ปนกับ overflow menu
// ────────────────────────────────────────────────────────────────────
function TxSearchAction() {
  return (
    <div style={{ cursor: 'pointer', display: 'flex' }}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke={RP.n700} strokeWidth="1.8"/>
        <path d="M16 16l4 4" stroke={RP.n700} strokeWidth="1.8" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

function TxRightActions() {
  return (
    <>

// ────────────────────────────────────────────────────────────────────
// State 4 — Interactive prototype · swipe / click / drag จริง
// ────────────────────────────────────────────────────────────────────
//   Gesture rules implemented:
//   - drag horizontal บน slider พื้นที่ใดก็ได้ที่ไม่ใช่ปุ่ม (data-role="button")
//   - threshold = 18% ของความกว้าง → snap ไป page ถัดไป
//   - Tx → swipe ขวา: clamp ไม่ให้เลย Chat (block ไป Menu)
//   - resistance ที่ขอบ (rubber-band) เพื่อ feedback ว่ามี boundary
//   - ☰ จาก Tx → ยังเปิด Menu ได้ (button shortcut bypass gesture rule)
//   - กดที่ pill, ☰, ✕ → setPage ทันที (transition smooth)
// ────────────────────────────────────────────────────────────────────
function GrokNav_Prototype({ bare = false } = {}) {
  // bare=true → hide dev chrome / use safe-area-inset for real mobile / measure actual width
  //
  // Two nested sliders:
  //   OUTER · Menu ↔ Pager       (full-page slide · top bar moves with Pager)
  //   INNER · Chat ↔ Transaction (content-only slide · shared top bar stays put)
  //
  // Gesture target is decided per drag from current state + direction:
  //   Pager.Chat + swipe right → OUTER (open Menu)
  //   Pager.Chat + swipe left  → INNER (to Tx)
  //   Pager.Tx   + swipe right → INNER (back to Chat) ← blocks Tx→Menu
  //   Pager.Tx   + swipe left  → INNER (resist, at end)
  //   Menu       + swipe left  → OUTER (close Menu)
  //   Menu       + swipe right → OUTER (resist, at end)
  const rootRef = React.useRef(null);
  const [PAGE_W, setPageW] = React.useState(390);
  React.useLayoutEffect(() => {
    const update = () => {
      if (rootRef.current) setPageW(rootRef.current.offsetWidth);
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  const [outerPage, setOuterPage] = React.useState(1); // 0=Menu · 1=Pager
  const [innerTab, setInnerTab] = React.useState(1);   // 1=Chat · 2=Tx
  const [drag, setDrag] = React.useState({ target: null, dx: 0 });
  const [dragging, setDragging] = React.useState(false);
  const dragRef = React.useRef({ target: null, dx: 0, locked: false });
  const startX = React.useRef(0);
  const startY = React.useRef(0);
  const stateRef = React.useRef({ outerPage: 1, innerTab: 1 });
  React.useEffect(() => { stateRef.current = { outerPage, innerTab }; }, [outerPage, innerTab]);

  const beginDrag = (e) => {
    if (e.target.closest && e.target.closest('[data-role="button"]')) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    startX.current = x;
    startY.current = y;
    dragRef.current = { target: null, dx: 0, locked: false };
    setDrag({ target: null, dx: 0 });
    setDragging(true);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const getXY = (e) => e.touches
      ? [e.touches[0].clientX, e.touches[0].clientY]
      : [e.clientX, e.clientY];

    const onMove = (e) => {
      const [x, y] = getXY(e);
      const dx = x - startX.current;
      const dy = y - startY.current;
      let { target, locked } = dragRef.current;
      const { outerPage: op, innerTab: it } = stateRef.current;

      // Lock gesture axis on first decisive move
      if (!locked) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          // Vertical scroll → abandon gesture entirely
          dragRef.current = { target: 'v', dx: 0, locked: true };
          setDrag({ target: null, dx: 0 });
          return;
        }
        // Horizontal → pick slider target from current state + direction
        if (op === 0) {
          target = 'outer';
        } else { // pager
          if (it === 1) target = dx > 0 ? 'outer' : 'inner';
          else target = 'inner'; // tx: both directions handled by inner
        }
        dragRef.current = { target, dx: 0, locked: true };
      }
      if (target === 'v') return;

      // Edge resistance per target
      let d = dx;
      if (target === 'outer') {
        if (op === 0 && d < 0) {} // valid (closing menu)
        else if (op === 0 && d > 0) d = d * 0.25; // past menu right edge
        else if (op === 1 && d < 0) d = d * 0.25; // past pager right edge
        // op===1 && d>0 = opening menu, valid
      } else if (target === 'inner') {
        if (it === 1 && d < 0) {} // valid (chat → tx)
        else if (it === 1 && d > 0) d = d * 0.25; // chat trying to scroll right inside → resist
        else if (it === 2 && d > 0) {} // valid (tx → chat)
        else if (it === 2 && d < 0) d = d * 0.25; // past tx right edge
      }
      dragRef.current = { target, dx: d, locked: true };
      setDrag({ target, dx: d });
    };

    const onUp = () => {
      const { target, dx } = dragRef.current;
      const { outerPage: op, innerTab: it } = stateRef.current;
      const t = PAGE_W * 0.18;
      if (target === 'outer') {
        if (dx > t && op === 1) setOuterPage(0);
        else if (dx < -t && op === 0) setOuterPage(1);
      } else if (target === 'inner') {
        if (dx > t && it === 2) setInnerTab(1);
        else if (dx < -t && it === 1) setInnerTab(2);
      }
      setDrag({ target: null, dx: 0 });
      setDragging(false);
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
  }, [dragging, PAGE_W]);

  const outerDx = drag.target === 'outer' ? drag.dx : 0;
  const innerDx = drag.target === 'inner' ? drag.dx : 0;
  const outerOffset = -outerPage * PAGE_W + outerDx;
  const innerOffset = -(innerTab - 1) * PAGE_W + innerDx;
  const offset = outerOffset; // keep old name for downstream code below
  const page = outerPage === 0 ? 0 : innerTab; // 0=menu, 1=chat, 2=tx (for indicator)
  const setPage = (p) => {
    if (p === 0) {
      // Tx → Menu must route through Chat per gesture rule (button is exempt
      // but keep indicator behavior consistent with the swipe rule)
      if (outerPage === 1 && innerTab === 2) {
        setInnerTab(1);
        setTimeout(() => setOuterPage(0), 100);
      } else setOuterPage(0);
    } else {
      setOuterPage(1);
      setInnerTab(p);
    }
  };

  return (
    <div ref={rootRef} style={{
      width: '100%', height: '100%', background: N.gray4,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
      fontFamily: 'Sarabun, -apple-system, system-ui, sans-serif',
    }}>
      {!bare && (
        <>
          {/* title strip */}
          <div style={{
            padding: '10px 14px', background: '#fff',
            borderBottom: `1px solid ${N.gray3}`, flexShrink: 0,
          }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: N.ink, letterSpacing: -0.1 }}>
              4 · Interactive prototype
            </div>
            <div style={{ fontSize: 11, color: N.gray1, marginTop: 2, lineHeight: 1.4 }}>
              ลาก / คลิก ☰ ✕ pill ได้จริง · จาก Tx ลองลากขวาดู → ติดที่ Chat (ต้องกด ☰ ถึงไป Menu)
            </div>
          </div>
          {/* fake status bar */}
          <div style={{
            height: 32, padding: '0 16px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            fontSize: 11, color: N.gray1, background: '#fff',
            borderBottom: `1px solid ${N.gray3}`, flexShrink: 0,
          }}>
            <span>10:13</span>
            <span>•••  🔋</span>
          </div>
        </>
      )}

      {/* OUTER slider viewport: Menu ↔ Pager */}
      <div
        onMouseDown={beginDrag}
        onTouchStart={beginDrag}
        style={{
          flex: 1, overflow: 'hidden', position: 'relative',
          background: '#fff', userSelect: 'none', touchAction: 'pan-y',
          cursor: dragging ? 'grabbing' : 'grab',
        }}
      >
        <div style={{
          display: 'flex',
          width: PAGE_W * 2, height: '100%',
          transform: `translateX(${outerOffset}px)`,
          transition: dragging && drag.target === 'outer'
            ? 'none'
            : 'transform 0.32s cubic-bezier(0.32, 0.72, 0, 1)',
          willChange: 'transform',
        }}>
          <ProtoMenu w={PAGE_W} bare={bare} onClose={() => setOuterPage(1)} />

          {/* PAGER: fixed top bar + INNER slider (Chat content ↔ Tx content) */}
          <div style={{
            flex: `0 0 ${PAGE_W}px`, height: '100%',
            display: 'flex', flexDirection: 'column',
          }}>
            <ProtoTopBar
              active={innerTab}
              bare={bare}
              onMenu={() => setOuterPage(0)}
              onTab={setInnerTab}
            />
            <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
              <div style={{
                display: 'flex',
                width: PAGE_W * 2, height: '100%',
                transform: `translateX(${innerOffset}px)`,
                transition: dragging && drag.target === 'inner'
                  ? 'none'
                  : 'transform 0.32s cubic-bezier(0.32, 0.72, 0, 1)',
                willChange: 'transform',
              }}>
                <ProtoChatContent w={PAGE_W} bare={bare} />
                <ProtoTxContent   w={PAGE_W} bare={bare} />
              </div>
            </div>
          </div>
        </div>
      </div>

      {!bare && (
        <div style={{
          padding: '8px 14px 10px', background: '#fff',
          borderTop: `1px solid ${N.gray3}`, flexShrink: 0,
        }}>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 6 }}>
            {['MENU', 'CHAT', 'TX'].map((label, i) => (
              <div
                key={i}
                data-role="button"
                onClick={() => {
                  if (i === 0 && page === 2) { setPage(1); setTimeout(() => setPage(0), 100); }
                  else setPage(i);
                }}
                style={{
                  padding: '3px 10px', borderRadius: 10, cursor: 'pointer',
                  background: page === i ? N.ink : N.gray3,
                  color: page === i ? '#fff' : N.gray1,
                  fontSize: 9, fontWeight: 700, letterSpacing: 0.6,
                  transition: 'all 0.2s',
                }}
              >{label}</div>
            ))}
          </div>
          <div style={{ fontSize: 9.5, color: N.gray1, marginTop: 6, textAlign: 'center', lineHeight: 1.5 }}>
            drag/swipe · กด pill ก็สลับ · ☰ จาก Tx เปิด Menu ได้ (bypass rule)
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Category chip rail — frequent + "ดูทั้งหมด" + bottom-sheet picker ────────
function ECategoryChips({ value, onChange }) {
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [pickerCat, setPickerCat] = React.useState(null); // step-2 category being drilled into

  const frequent = FREQUENT_CAT_KEYS.map(findCat);
  const selectedCat = value ? findCat(value.key) : null;
  const selectedSub = selectedCat && value?.subKey ? findSub(selectedCat, value.subKey) : null;
  // Show breadcrumb chip when current selection isn't in the visible 4 OR when a sub-cat is chosen.
  const showBreadcrumb = selectedCat && (!FREQUENT_CAT_KEYS.includes(selectedCat.key) || !!selectedSub);

  const openPicker = () => { setPickerCat(null); setPickerOpen(true); };
  const closePicker = () => { setPickerOpen(false); setPickerCat(null); };

  const pickCategory = (cat) => {
    if (!cat.subs || cat.subs.length === 0) {
      onChange?.({ key: cat.key, subKey: null });
      closePicker();
    } else {
      setPickerCat(cat);
    }
  };
  const pickSub = (cat, sub) => {
    onChange?.({ key: cat.key, subKey: sub.key });
    closePicker();
  };
  const pickCategoryOnly = (cat) => {
    onChange?.({ key: cat.key, subKey: null });
    closePicker();
  };

  const renderChip = (c) => {
    const on = value?.key === c.key && !value?.subKey;
    return (
      <div

          width: 32, height: 32, borderRadius: 10,

const PRESET_TAGS = [
  'ทริปเชียงใหม่', 'งานบริษัท', 'ลดน้ำหนัก', 'ของขวัญ',
  'ครอบครัว', 'งานแต่ง', 'reimburse', 'ของฟุ่มเฟือย',
  'ค่ารักษา', 'ค่าเรียน', 'ลงทุน',
];

function ETagsRow({ value = [], onChange, allTags = PRESET_TAGS }) {
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [query, setQuery] = React.useState('');
  const [pool, setPool] = React.useState(allTags);

  const toggle = (tag) => {
    if (value.includes(tag)) onChange?.(value.filter(t => t !== tag));
    else onChange?.([...value, tag]);
  };
  const remove = (tag) => onChange?.(value.filter(t => t !== tag));

  const q = query.trim();
  const filtered = q ? pool.filter(t => t.toLowerCase().includes(q.toLowerCase())) : pool;
  const exactExists = pool.some(t => t.toLowerCase() === q.toLowerCase());
  const canCreate = q.length > 0 && !exactExists;

  const createTag = () => {
    if (!canCreate) return;
    setPool([q, ...pool]);
    onChange?.([...value, q]);
    setQuery('');
  };

  return (
    <div style={{ padding: '0 16px 12px' }}>
      <div style={{
        background: '#fff', borderRadius: 14, padding: '8px 10px',

// ─── Wallet + Category 2-column tile row ──────────────────
function EWalletCatRow({ catValue, onCatChange, walletLabel = 'ครอบครัว', walletHint = '34,368฿' }) {
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [pickerCat, setPickerCat] = React.useState(null);

  const selectedCat = catValue ? findCat(catValue.key) : null;
  const selectedSub = selectedCat && catValue?.subKey ? findSub(selectedCat, catValue.subKey) : null;

  const openPicker = () => { setPickerCat(null); setPickerOpen(true); };
  const closePicker = () => { setPickerOpen(false); setPickerCat(null); };

  const pickCategory = (cat) => {
    if (!cat.subs || cat.subs.length === 0) {
      onCatChange?.({ key: cat.key, subKey: null });
      closePicker();
    } else {
      setPickerCat(cat);
    }
  };
  const pickSub = (cat, sub) => {
    onCatChange?.({ key: cat.key, subKey: sub.key });
    closePicker();
  };
  const pickCategoryOnly = (cat) => {
    onCatChange?.({ key: cat.key, subKey: null });
    closePicker();
  };

  const tileBase = {
    background: '#fff', borderRadius: 14, padding: '10px 12px',
    boxShadow: '0 1px 2px rgba(0,0,0,0.03)',
    cursor: 'pointer',
    display: 'flex', alignItems: 'center', gap: 10,
    minHeight: 56,
  };

  return (
    <div style={{ padding: '0 16px 10px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
      {/* Wallet tile */}
      <div style={tileBase}>
        <div style={{
          width: 36, height: 36, borderRadius: 12, background: TE.walletPink100,
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}>
          <CatIcon kind="piggy" containerSize={36} color={TE.walletPink} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 11, color: TE.n400, fontWeight: 600, letterSpacing: 0.2 }}>กระเป๋า</div>
          <div style={{
            fontSize: 14, fontWeight: 700, color: TE.n900, letterSpacing: 0.1,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
          }}>{walletLabel}</div>
          <div style={{ fontSize: 10, color: TE.n400, fontWeight: 500 }}>{walletHint}</div>
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style={{ flexShrink: 0 }}>
          <path d="M6 9l6 6 6-6" stroke={TE.n400} strokeWidth="2" strokeLinecap="round"/>
        </svg>
      </div>

      {/* Category tile */}
      <div onClick={openPicker} style={tileBase}>
        <div style={{
          width: 36, height: 36, borderRadius: 12,
          background: selectedCat ? selectedCat.bg : TE.n200,
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}>
          {selectedCat ? (
            <CatIcon kind={selectedCat.icon} containerSize={36} color={selectedCat.ic} />
          ) : (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="5" cy="6" r="1.4" fill={TE.n500}/>
              <circle cx="5" cy="12" r="1.4" fill={TE.n500}/>
              <circle cx="5" cy="18" r="1.4" fill={TE.n500}/>
              <path d="M10 6h10M10 12h10M10 18h10" stroke={TE.n500} strokeWidth="2" strokeLinecap="round"/>
            </svg>
          )}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 11, color: TE.n400, fontWeight: 600, letterSpacing: 0.2 }}>หมวดหมู่</div>
          {selectedCat ? (
            <>
              <div style={{
                fontSize: 14, fontWeight: 700, color: TE.n900, letterSpacing: 0.1,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{selectedCat.label}</div>
              {selectedSub && (
                <div style={{
                  fontSize: 10, color: TE.n400, fontWeight: 500,
                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                }}>{selectedSub.label}</div>
              )}
            </>
          ) : (
            <div style={{ fontSize: 14, fontWeight: 600, color: TE.n400 }}>เลือก…</div>
          )}
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style={{ flexShrink: 0 }}>
          <path d="M6 9l6 6 6-6" stroke={TE.n400} strokeWidth="2" strokeLinecap="round"/>
        </svg>
      </div>

      {pickerOpen && (
        <ECategoryPicker
          step2Cat={pickerCat}
          onBack={() => setPickerCat(null)}
          onClose={closePicker}
          onPickCategory={pickCategory}
          onPickSub={pickSub}
          onPickCategoryOnly={pickCategoryOnly}
          currentValue={catValue}
        />
      )}
    </div>
  );
}

// ─── Design Panel Component ──────────────────────────────────
function DesignPanel({ visible, onClose }) {
  if (!visible) return null;

  const [activeTab, setActiveTab] = React.useState('category');
  const [categoryColors, setCategoryColors] = React.useState(CATEGORY_COLORS);
  const [walletColors] = React.useState(WALLET_COLORS);
  const [selectedColor, setSelectedColor] = React.useState(null);

  const getColors = () => activeTab === 'wallet' ? walletColors : categoryColors;
  const getSetColors = () => activeTab === 'wallet' ? () => {} : setCategoryColors;

  const handleColorChange = (index, newColor) => {
    const colors = getColors();
    const setColors = getSetColors();
    const newColors = [...colors];
    newColors[index] = { ...newColors[index], ...newColor };
    setColors(newColors);

    <div style={{

<script type="text/babel">
// Financial Summary — bottom sheet opened by tapping the Net Worth header on Home.
//   PURPOSE: help the user UNDERSTAND their money at a glance — not list accounts.
//   Health-dashboard layout: Net Worth hero → health score + ratios → asset/liability
//   summary cards → composition → actionable insights. Reuses v4 sheet primitives.
(function () {
const NW = window.MINT;

const card = (elev = 1) => ({
  background: '#fff', borderRadius: 16,
  boxShadow: elev === 2 ?
    '0 4px 12px rgba(0,0,0,0.06), 0 16px 40px rgba(0,0,0,0.05)' :
    '0 1px 2px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.03)',
});
const INK = {
  muted: '#6B6B78',
  faint: '#9A99A6',
  divider: '#ECECF1',
  posInk: '#3F8C5C',   // asset / good
  negSoft: '#C45A3D',  // liability / debt
};
const fmt = (n) => Math.abs(n).toLocaleString('en-US');

// ────────────────────────────────────────────────
// Summary figures (reconciled): สินทรัพย์ − หนี้สิน = 125,430
// ────────────────────────────────────────────────
const ASSET = 460473;
const LIAB = 335043;
const NETWORTH = ASSET - LIAB;          // 125,430
const LIQUID = 335473;                   // เงินสด + บัญชีออม
const GOALS = 125000;                    // เป้าหมายออม
const DEBT_RATIO = Math.round((LIAB / ASSET) * 100);  // 73%
const SAVE_RATE = 18;                    // อัตราออม (รายรับ → ออม)
const RUNWAY = 6;                        // สภาพคล่อง (เดือน)
const SCORE = 72;                        // health score 0-100
const DEBT_INTEREST = 3400;              // ดอกเบี้ยโดยประมาณ/เดือน
const DEBT_LIMIT = 450000;
const DEBT_UTIL = Math.round((LIAB / DEBT_LIMIT) * 100);  // 74%
const DEBT_DOWN = 12000;                 // หนี้ลดลงเดือนนี้

const SPARK = [40, 35, 45, 42, 55, 48, 62];

// Score band → label + color
function scoreBand(s) {
  if (s >= 80) return { label: 'ดีมาก', color: NW.walletGreen };
  if (s >= 60) return { label: 'ดี', color: NW.primary500 };
  if (s >= 40) return { label: 'พอใช้', color: NW.warning400 };
  return { label: 'ควรปรับ', color: NW.walletRed };
}

// ────────────────────────────────────────────────
// Sheet header
// ────────────────────────────────────────────────
function SheetHeader() {
  return (
    <>
      <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 8, paddingBottom: 8 }}>
        <div style={{ width: 36, height: 4, borderRadius: 2, background: NW.n300 }} />
      </div>
      <div style={{ padding: '6px 18px 14px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke={NW.n800} strokeWidth="2.2" strokeLinecap="round" />
          </svg>
        </div>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 17, fontWeight: 700, color: NW.n900 }}>สรุปการเงิน</div>
        <div style={{ width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="5" r="1.6" fill={NW.n800} />
            <circle cx="12" cy="12" r="1.6" fill={NW.n800} />
            <circle cx="12" cy="19" r="1.6" fill={NW.n800} />
          </svg>
        </div>
      </div>
      <div style={{ height: 1, background: INK.divider }} />
    </>
  );
}

// ────────────────────────────────────────────────
// Hero — net worth + change + sparkline + hide toggle
// ────────────────────────────────────────────────
function HeroCard({ hidden, onToggle }) {
  const w = 88, h = 32;
  const max = Math.max(...SPARK), min = Math.min(...SPARK);
  const path = SPARK.map((v, i) => {
    const x = (i / (SPARK.length - 1)) * w;
    const y = h - ((v - min) / (max - min)) * (h - 3) - 1.5;
    return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  return (
    <div style={{ margin: '14px 16px 12px', ...card(1), padding: '16px 18px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ fontSize: 12, color: INK.muted, fontWeight: 600, letterSpacing: 0.3, textTransform: 'uppercase' }}>Net Worth</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" onClick={onToggle} style={{ cursor: 'pointer' }}>
          {hidden
            ? <path d="M3 3l18 18M10.5 10.7a2 2 0 002.8 2.8M6.5 6.5C4.5 8 3 10 2 12c2 4 6 7 10 7 1.5 0 3-.4 4.3-1M10 5.2A9 9 0 0112 5c4 0 8 3 10 7-.5 1-1.2 2-2 2.8" stroke={INK.faint} strokeWidth="1.6" strokeLinecap="round" />
            : <><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke={INK.faint} strokeWidth="1.6" /><circle cx="12" cy="12" r="3" stroke={INK.faint} strokeWidth="1.6" /></>}
        </svg>
      </div>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginTop: 4 }}>
        <div style={{ fontSize: 32, fontWeight: 700, color: NW.n900, letterSpacing: -0.6, fontVariantNumeric: 'tabular-nums', lineHeight: 1.05 }}>
          ฿ {hidden ? '•••,•••' : fmt(NETWORTH)}
        </div>
        <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ marginBottom: 2 }}>
          <defs>
            <linearGradient id="nwHeroSpark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stopColor={NW.primary400} stopOpacity="0.22" />
              <stop offset="1" stopColor={NW.primary400} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${path} L ${w} ${h} L 0 ${h} Z`} fill="url(#nwHeroSpark)" />
          <path d={path} stroke={NW.primary400} strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, marginTop: 6 }}>
        <span style={{ color: NW.primary500, fontWeight: 700 }}>↑ 2,935 ฿ (2.4%)</span>
        <span style={{ color: INK.faint }}>· 7 วันที่แล้ว</span>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────
// Health score — score ring + key ratios (the "how am I doing" card)
// ────────────────────────────────────────────────
function ScoreRing({ score, color }) {
  const r = 32, c = 2 * Math.PI * r, off = c * (1 - score / 100);
  return (
    <svg width="80" height="80" viewBox="0 0 80 80" style={{ flexShrink: 0 }}>
      <circle cx="40" cy="40" r={r} stroke={NW.n200} strokeWidth="7" fill="none" />
      <circle cx="40" cy="40" r={r} stroke={color} strokeWidth="7" fill="none"
        strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
        transform="rotate(-90 40 40)" />
      <text x="40" y="38" textAnchor="middle" fontSize="22" fontWeight="700" fill={NW.n900} fontFamily="Sarabun, sans-serif">{score}</text>
      <text x="40" y="52" textAnchor="middle" fontSize="9" fill={INK.faint} fontFamily="Sarabun, sans-serif">/ 100</text>
    </svg>
  );
}

function RatioRow({ label, value, status }) {
  // status: 'good' | 'warn' | 'bad'
  const map = {
    good: { color: INK.posInk, dot: NW.walletGreen },
    warn: { color: NW.warning400, dot: NW.warning400 },
    bad:  { color: INK.negSoft, dot: NW.walletRed },
  };
  const m = map[status];
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 0' }}>
      <div style={{ width: 7, height: 7, borderRadius: 4, background: m.dot, flexShrink: 0 }} />
      <div style={{ flex: 1, fontSize: 13, color: INK.muted, fontWeight: 500 }}>{label}</div>
      <div style={{ fontSize: 14, fontWeight: 700, color: m.color, fontVariantNumeric: 'tabular-nums' }}>{value}</div>
    </div>
  );
}

function HealthCard() {
  const band = scoreBand(SCORE);
  return (
    <div style={{ margin: '0 16px 12px', ...card(1), padding: '16px 18px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
        <ScoreRing score={SCORE} color={band.color} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, color: INK.muted, fontWeight: 600 }}>สุขภาพการเงิน</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: band.color, lineHeight: 1.2, marginTop: 2 }}>{band.label}</div>
          <div style={{ fontSize: 12, color: INK.faint, marginTop: 3, lineHeight: 1.4 }}>
            ออมสม่ำเสมอ แต่ภาระหนี้ยังสูง — ลดหนี้บัตรเพื่อยกระดับ
          </div>
        </div>
      </div>
      <div style={{ height: 1, background: INK.divider, margin: '12px 0 4px' }} />
      <RatioRow label="หนี้ต่อสินทรัพย์" value={`${DEBT_RATIO}%`} status="warn" />
      <RatioRow label="สภาพคล่อง (เดือนสำรอง)" value={`~${RUNWAY} เดือน`} status="good" />
      <RatioRow label="อัตราการออม" value={`${SAVE_RATE}%`} status="good" />
    </div>
  );
}

// ────────────────────────────────────────────────
// Two summary cards — สินทรัพย์ vs หนี้สิน (rolled-up, not per-account)
// ────────────────────────────────────────────────
function SummaryTile({ label, amount, sub, accent, trend, hidden }) {
  return (
    <div style={{ flex: 1, ...card(1), padding: '14px 14px 13px', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, width: 4, height: '100%', background: accent }} />
      <div style={{ fontSize: 12, color: INK.muted, fontWeight: 600, marginLeft: 4 }}>{label}</div>
      <div style={{ fontSize: 21, fontWeight: 700, color: NW.n900, letterSpacing: -0.4, fontVariantNumeric: 'tabular-nums', marginTop: 4, marginLeft: 4 }}>
        {hidden ? '•••' : fmt(amount)}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginTop: 7, marginLeft: 4 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: trend.color }}>{trend.text}</span>
      </div>
      <div style={{ fontSize: 11, color: INK.faint, marginTop: 5, marginLeft: 4, lineHeight: 1.3 }}>{sub}</div>
    </div>
  );
}

function SummaryRow({ hidden }) {
  return (
    <div style={{ margin: '0 16px 12px', display: 'flex', gap: 12 }}>
      <SummaryTile
        label="สินทรัพย์" amount={ASSET} accent={NW.walletGreen}
        trend={{ text: '↑ โต 1.8%', color: INK.posInk }}
        sub={`เงินสดคล่อง ${Math.round((LIQUID / ASSET) * 100)}%`} hidden={hidden} />
      <SummaryTile
        label="หนี้สิน" amount={LIAB} accent={NW.walletRed}
        trend={{ text: '↓ ลด 3.4%', color: INK.posInk }}
        sub={`ดอกเบี้ย ~${fmt(DEBT_INTEREST)}/เดือน`} hidden={hidden} />
    </div>
  );
}

// ────────────────────────────────────────────────
// Composition — asset breakdown bar + debt rollup
// ────────────────────────────────────────────────
function CompositionCard({ hidden }) {
  const liqPct = Math.round((LIQUID / ASSET) * 100);
  return (
    <div style={{ margin: '0 16px 12px', ...card(1), padding: '16px 18px' }}>

      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
          <div style={{ width: 8, height: 8, borderRadius: 4, background: NW.walletGreen }} />
          <div>
            <div style={{ fontSize: 12, color: INK.muted }}>เงินสด + ออม</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: NW.n900, fontVariantNumeric: 'tabular-nums', marginTop: 1 }}>
              {hidden ? '•••' : fmt(LIQUID)}
            </div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, color: INK.muted }}>เป้าหมายออม</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: NW.n900, fontVariantNumeric: 'tabular-nums', marginTop: 1 }}>

            </div>

          <div style={{ width: 8, height: 8, borderRadius: 4, background: NW.walletPink }} />
        </div>
      </div>

      <div style={{ height: 1, background: INK.divider, margin: '14px 0' }} />

      <div style={{ fontSize: 14, fontWeight: 700, color: NW.n900, marginBottom: 12 }}>ภาระหนี้</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: INK.muted }}>วงเงินใช้ไป (utilization)</div>
          <div style={{ marginTop: 6, height: 8, borderRadius: 4, background: NW.n200, overflow: 'hidden' }}>

function Insights() {
  return (

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#38B2AC"
}/*EDITMODE-END*/;

function applyTweaks(tweaks) {
  // Recolor teal tokens based on primary color input
  const base = tweaks.primaryColor || '#38B2AC';
  // Create a scale by tinting/shading
  const hexToRgb = h => {
    const n = parseInt(h.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const rgbToHex = ([r,g,b]) => '#' + [r,g,b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2,'0')).join('');
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const [r,g,b] = hexToRgb(base);
  window.MINT.primary400 = base;
  window.MINT.primary500 = rgbToHex(mix([r,g,b],[0,0,0],0.15));
  window.MINT.primary600 = rgbToHex(mix([r,g,b],[0,0,0],0.3));
  window.MINT.primary300 = rgbToHex(mix([r,g,b],[255,255,255],0.25));
  window.MINT.primary200 = rgbToHex(mix([r,g,b],[255,255,255],0.55));
  window.MINT.primary100 = rgbToHex(mix([r,g,b],[255,255,255],0.75));
  window.MINT.gradStart = rgbToHex(mix([r,g,b],[255,255,255],0.88));
  window.MINT.gradEnd = rgbToHex(mix([r,g,b],[255,255,255],0.9));
}

function TweakPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, zIndex: 1000,
      width: 280, background: '#fff', borderRadius: 14,
      boxShadow: '0 10px 40px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.1)',
      padding: '14px 16px',
      fontFamily: '-apple-system, system-ui, sans-serif',
    }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: '#333', marginBottom: 10 }}>Tweaks</div>
      <label style={{ display: 'block', fontSize: 11, color: '#666', marginBottom: 4 }}>Primary color</label>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <input
          type="color"
          value={tweaks.primaryColor}
          onChange={e => setTweaks({ ...tweaks, primaryColor: e.target.value })}
          style={{ width: 40, height: 30, border: 'none', cursor: 'pointer', background: 'transparent' }}

        <div style={{ fontSize: 12, fontFamily: 'monospace', color: '#333' }}>{tweaks.primaryColor}</div>
      </div>

        {['#38B2AC','#319795','#14B8A6','#0D9488','#6366F1','#EC4899','#F59E0B','#10B981'].map(c => (
          <div key={c} onClick={() => setTweaks({ ...tweaks, primaryColor: c })}
            style={{
              width: 24, height: 24, borderRadius: 12, background: c, cursor: 'pointer',
              border: tweaks.primaryColor === c ? '2px solid #000' : '2px solid rgba(0,0,0,0.1)',
            }} />
        ))}
      </div>
    </div>
  );
}
